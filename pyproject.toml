[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecbuddy"
version = "0.1.0"
description = "AI DevSecBuddy — automated adversarial AI-security testing library (roadmap M1 core: contract + MockEngine + SQLite ledger)."
readme = "devsecbuddy/README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Cloud engine adapters (roadmap M6): anthropic = Claude via the Anthropic API;
# vertex = Google Gemini via GCP Vertex AI (the google-genai SDK, ADC auth).
anthropic = ["anthropic>=0.40"]
vertex = ["google-genai>=1.0"]
backend = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",  # resume PDF uploads
  "pypdf>=4",                 # resume PDF text extraction
]
dev = [
  "pytest>=7", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
  "python-multipart>=0.0.9", "pypdf>=4",
]

[project.scripts]
devsecbuddy = "devsecbuddy.cli:main"

[tool.setuptools.packages.find]
include = ["devsecbuddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
